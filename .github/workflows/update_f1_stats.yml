name: Update Pole2Stat Rankings

on:
  schedule:
    # 매주 월요일 UTC 00:00 (한국시간 월요일 오전 09:00)
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      start_year:
        description: "아카이브 시작 연도 (현대 Q1/Q2/Q3 시작: 2006)"
        required: false
        default: "2006"
        type: string
      use_fastf1:
        description: "2018년 이후 시즌에 FastF1 정밀 랩타임 병합 사용 (기본 false 권장)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      force_refresh_archive:
        description: "저장된 과거 시즌 아카이브 강제 재수집"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pole2Stat v2 pipeline (2006-2026)
        run: |
          START_YEAR="${{ inputs.start_year || '2006' }}"
          ARGS="--start-year $START_YEAR --active-season 2026 --data-dir data --n-bootstrap 25"
          if [ "${{ inputs.use_fastf1 }}" = "true" ]; then
            ARGS="$ARGS --use-fastf1"
          fi
          if [ "${{ inputs.force_refresh_archive }}" = "true" ]; then
            ARGS="$ARGS --force-refresh-archive"
          fi
          python update_incremental_seasons.py $ARGS

      - name: Commit and push updated rankings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경된 통계 데이터가 없습니다."
          else
            git commit -m "chore: update Pole2Stat rankings ($(date -u +'%Y-%m-%d'))"
            git push
          fi
