name: Update F1 STATIZ Rankings

on:
  schedule:
    # 매주 월요일 UTC 00:00 (한국시간 월요일 오전 09:00, 경기 종료 및 페널티 확정 이후)
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      skip_fastf1:
        description: "FastF1 랩타임 생략하고 Jolpica 결과만 빠르게 갱신"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      force_refresh_archive:
        description: "2024~2025 확정 아카이브 CSV 강제 재수집"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache FastF1 session data
        uses: actions/cache@v4
        with:
          path: fastf1_cache
          key: fastf1-cache-${{ runner.os }}-2026-${{ github.run_id }}
          restore-keys: |
            fastf1-cache-${{ runner.os }}-2026-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run incremental F1 sabermetrics pipeline
        run: |
          ARGS="--archive-seasons 2021 2022 2023 2024 2025 --active-season 2026 --data-dir data"
          if [ "${{ inputs.skip_fastf1 }}" = "true" ]; then
            ARGS="$ARGS --skip-fastf1"
          fi
          if [ "${{ inputs.force_refresh_archive }}" = "true" ]; then
            ARGS="$ARGS --force-refresh-archive"
          fi
          python update_incremental_seasons.py $ARGS

      - name: Commit and push updated rankings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경된 통계 데이터가 없습니다."
          else
            git commit -m "chore: update F1 STATIZ rankings ($(date -u +'%Y-%m-%d'))"
            git push
          fi
